name: Refresh market data

# Rebuilds data/snapshot.json every morning from Finnhub + SEC EDGAR and commits
# it back. The API key lives in repo secrets and never reaches the browser.

on:
  schedule:
    - cron: "20 10 * * 1-5"   # 10:20 UTC on weekdays — after SEC posts overnight filings
  workflow_dispatch:           # lets you run it on demand from the Actions tab
    inputs:
      limit:
        description: "Only process the first N companies (blank = all)"
        required: false
        default: ""
      skip_filings:
        description: "Skip downloading 10-Ks (1 = skip)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build snapshot
        env:
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          LIMIT: ${{ github.event.inputs.limit }}
          SKIP_FILINGS: ${{ github.event.inputs.skip_filings }}
        run: node scripts/refresh.mjs

      - name: Build the static company pages
        env:
          SITE_ORIGIN: https://stockornot.com
        run: node scripts/build-pages.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "stockornot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebasing loses to a conflict whenever someone else touched the same
          # data file mid-run. Instead: fetch the tip, move HEAD onto it keeping
          # our freshly built files staged, and commit on top. The run that just
          # spent an hour fetching wins, and no merge is ever attempted.
          git fetch origin "${GITHUB_REF_NAME}"
          git add data/snapshot.json data/filings data/detail stock sitemap.xml robots.txt
          git reset --soft FETCH_HEAD
          git add data/snapshot.json data/filings data/detail stock sitemap.xml robots.txt

          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Data refresh $(date -u +'%Y-%m-%d')"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
