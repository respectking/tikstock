name: Build company pages

# Regenerates the static per-company pages from whatever data is already
# committed. Takes seconds, hits no APIs — so template changes can ship without
# waiting on a full data refresh. The data refresh also runs this itself.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-pages.mjs"
      - "lib/analysis.mjs"
      - "data/snapshot.json"

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate pages
        env:
          SITE_ORIGIN: https://stockornot.com
        run: node scripts/build-pages.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "stockornot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebasing loses to a conflict whenever someone else touched the same
          # data file mid-run. Instead: fetch the tip, move HEAD onto it keeping
          # our freshly built files staged, and commit on top. The run that just
          # spent an hour fetching wins, and no merge is ever attempted.
          git fetch origin "${GITHUB_REF_NAME}"
          git add stock sitemap.xml robots.txt
          git reset --soft FETCH_HEAD
          git add stock sitemap.xml robots.txt

          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Rebuild company pages $(date -u +'%Y-%m-%d')"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
